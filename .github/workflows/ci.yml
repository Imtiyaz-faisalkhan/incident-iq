name: CI

# When to run: every push to main, every pull request targeting main,
# and manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# If a newer commit is pushed while a run is in progress, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest # GitHub-hosted Linux runner; Docker is preinstalled for Testcontainers
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # reuse downloaded Maven dependencies between runs

      - name: Build and run all tests
        run: ./mvnw -B verify # -B = batch mode for clean CI logs

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
