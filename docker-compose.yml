services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: incident-iq-postgres
    environment:
      POSTGRES_DB: incidentiq
      POSTGRES_USER: incidentiq
      POSTGRES_PASSWORD: incidentiq
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - incident-iq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentiq -d incidentiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  incident-iq-postgres-data: