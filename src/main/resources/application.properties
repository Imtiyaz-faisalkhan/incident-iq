spring.application.name=incident-iq

# Development defaults only; override via environment variables outside local dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/incidentiq}
spring.datasource.username=${DB_USERNAME:incidentiq}
spring.datasource.password=${DB_PASSWORD:incidentiq}
spring.datasource.driver-class-name=org.postgresql.Driver

# Temporary for local development; replace with Flyway migrations before production use.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# To see generated SQL locally, set logging.level.org.hibernate.SQL=debug (e.g. via env var or a dev profile).
